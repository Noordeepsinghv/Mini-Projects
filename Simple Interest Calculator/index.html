<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
</head>

<body>
    <div class="maindiv">
        <h1>Simple Interest Calculator</h1>
        <div class="inputdiv">
            <div id="principleDiv" class="inputContainer">
                <!-- <label for="principle" id="principle">principle</label> -->
                <input type="number" id="principle" class="input" title="principle" placeholder="Principle" onchange="squeezeInput()">
            </div>
            <div id="rateDiv" class="inputContainer">
                <!-- <label for="rateValue" id="rateValue">Rate</label> -->
                <input id="rateValue" class="input" min="1" max="20" value="" placeholder="Rate" onchange="updateRateValue(), updateRate()">
                <input type="range" id="rate" min="1" max="20" value="10.25" step="0.25" onchange="updateRate()">
            </div>
            <div id="timeDiv" class="inputContainer">
                <!-- <label for="years" id="years">Time</label> -->
                <input type="number" class="input" id="years" list="all_years" placeholder="Time">
                <datalist id="all_years">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </datalist>
            </div>
        </div>
        <div class="outputdiv">
            <button id="outputLable" onclick="compute()" >Output</button>
            <span id="result">Press output to get results</span><br>
        </div>
    </div>
    <div>
        <button id="DayNightSwitch" onclick="toggleDayNight()">
            <img id="DayNightIcon" src="solid-black-sun-symbol.png" alt="Day/Night Icon">
        </button>
    </div>
    <footer>
        &#169; This calculator is built and designed by <b>Noordeep Singh.<b>
    </footer>
    <div id="themeOverlay"></div>
    
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</body>

</html>
